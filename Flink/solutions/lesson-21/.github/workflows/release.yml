name: release

on:
  push:
    tags: ["v*"]

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test e2eTest shadowJar --console=plain
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          image="ghcr.io/${{ github.repository }}/payguard-job:${{ github.ref_name }}"
          docker build -f docker/job.Dockerfile -t "$image" .
          docker push "$image"
