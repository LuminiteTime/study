name: payguard

x-flink-common: &flink-common
  image: flink:2.2.1-java17
  environment:
    FLINK_PROPERTIES: |
      jobmanager.rpc.address: jobmanager
      taskmanager.numberOfTaskSlots: 4
      parallelism.default: 2
      jobmanager.memory.process.size: 1600m
      taskmanager.memory.process.size: 2048m
      state.backend.type: rocksdb
      execution.checkpointing.dir: file:///flink-data/checkpoints
      execution.checkpointing.savepoint-dir: file:///flink-data/savepoints
      execution.checkpointing.incremental: true
      execution.checkpointing.interval: 30s
      execution.checkpointing.min-pause: 10s
      execution.checkpointing.timeout: 5min
      execution.checkpointing.tolerable-failed-checkpoints: 3
      execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
      execution.checkpointing.num-retained: 3
      restart-strategy.type: exponential-delay
      restart-strategy.exponential-delay.initial-backoff: 1s
      restart-strategy.exponential-delay.max-backoff: 1min
      restart-strategy.exponential-delay.backoff-multiplier: 2.0
      restart-strategy.exponential-delay.reset-backoff-threshold: 10min
      restart-strategy.exponential-delay.jitter-factor: 0.1
    PAYGUARD_DB_URL: jdbc:postgresql://postgres:5432/payguard
    PAYGUARD_DB_USER: payguard
    PAYGUARD_DB_PASSWORD: payguard
  volumes:
    - ./build/libs:/jobs:ro
    - ./data:/flink-data

services:
  kafka:
    image: apache/kafka:4.3.2
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:4.3.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for topic in payments.raw payments.dlq payments.late payments.confirmations payments.confirmed merchant.stats card.sessions fraud.alerts rules.config; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$$topic" --partitions 4 --replication-factor 1
        done

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payguard
      POSTGRES_USER: payguard
      POSTGRES_PASSWORD: payguard
    ports:
      - "5432:5432"
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payguard -d payguard"]
      interval: 5s
      timeout: 5s
      retries: 20

  jobmanager:
    <<: *flink-common
    command: jobmanager
    ports:
      - "8081:8081"

  taskmanager:
    <<: *flink-common
    command: taskmanager
    restart: unless-stopped
    depends_on:
      - jobmanager
